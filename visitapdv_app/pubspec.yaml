name: visitapdv_app
description: Aplicación móvil VisitaPDV para gestión de visitas a puntos de venta — Farmaenlace.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.4

  # HTTP
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.3

  # GPS
  geolocator: ^11.0.0

  # DI
  get_it: ^7.7.0
  injectable: ^2.4.1

  # Biometría y seguridad
  local_auth: ^2.1.8
  device_info_plus: ^9.1.2

  # Auto-lock / timer
  flutter_timer_countdown: ^1.0.7

  # Utils
  intl: ^0.19.0
  logger: ^2.3.0
  dart_jsonwebtoken: ^2.8.1
  connectivity_plus: ^5.0.2
  uuid: ^4.4.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  pinput: ^3.0.1
  lottie: ^3.0.0

  # Analytics / Dashboard
  fl_chart: ^0.68.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Cámara + imágenes
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  photo_view: ^0.15.0
  file_picker: ^8.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  injectable_generator: ^2.4.2
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
